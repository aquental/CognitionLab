[project]
name = "anonimizador"
version = "0.1.0"
description = "Local tools to anonymize medical PDFs and images and to verify that no identifier is left."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# The verifier needs only the standard library plus poppler and tesseract on PATH.
dependencies = [
    "pillow>=10.1",
]

[project.scripts]
anonimizador = "anonimizador.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonimizador"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
# Review reports are kept as the reviewers wrote them: formatting the code in them changes
# the record.
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
