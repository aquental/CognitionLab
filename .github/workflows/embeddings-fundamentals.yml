name: embeddings-fundamentals

on:
  push:
    branches: [main]
    paths: ["embeddings-fundamentals/**", ".github/workflows/embeddings-fundamentals.yml"]
  pull_request:
    paths: ["embeddings-fundamentals/**", ".github/workflows/embeddings-fundamentals.yml"]

defaults:
  run:
    working-directory: embeddings-fundamentals

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy matrix, unit + BDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: embeddings-fundamentals
      - name: Format
        run: cargo fmt --check
      - name: Clippy (no engine features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (each engine alone)
        run: |
          for feature in engine-embed-anything engine-fastembed engine-openai; do
            cargo clippy --all-targets --features "$feature" -- -D warnings
          done
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests (unit, doc, bdd, bdd_selftest)
        run: cargo test
      - name: Upload BDD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-report
          path: embeddings-fundamentals/reports/bdd/
          if-no-files-found: warn

  integration-local:
    name: integration (poppler, tesseract, local engines)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler and tesseract
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-por
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: embeddings-fundamentals
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('embeddings-fundamentals/config/experiments/**') }}
      - name: Integration tests
        env:
          RUN_INTEGRATION: "1"
        run: cargo test --features engine-embed-anything,engine-fastembed --test integration -- --include-ignored

  integration-openai:
    name: integration (OpenAI, optional)
    runs-on: ubuntu-latest
    needs: check
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.OPENAI_API_KEY != ''
      - name: Install toolchain from rust-toolchain.toml
        if: env.OPENAI_API_KEY != ''
        run: rustup show active-toolchain || rustup toolchain install
      - name: OpenAI integration tests
        if: env.OPENAI_API_KEY != ''
        env:
          RUN_INTEGRATION: "1"
        run: cargo test --features engine-openai --test integration -- --include-ignored
      - name: Report outstanding
        if: env.OPENAI_API_KEY == ''
        run: echo "OpenAI integration is OUTSTANDING (no OPENAI_API_KEY secret); not reported as passed."
