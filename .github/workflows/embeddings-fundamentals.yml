name: embeddings-fundamentals

on:
  push:
    branches: [main]
    paths: ["embeddings-fundamentals/**", ".github/workflows/embeddings-fundamentals.yml"]
  pull_request:
    paths: ["embeddings-fundamentals/**", ".github/workflows/embeddings-fundamentals.yml"]

defaults:
  run:
    working-directory: embeddings-fundamentals

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy matrix, unit + BDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.99.1 (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Verify toolchain
        run: rustc --version | grep -F "rustc 1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: embeddings-fundamentals
      - name: Format
        run: cargo fmt --check
      - name: Clippy (no engine features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (each engine alone)
        run: |
          for feature in engine-embed-anything engine-fastembed engine-openai; do
            cargo clippy --all-targets --features "$feature" -- -D warnings
          done
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests (unit, doc, fixtures, bdd, bdd_selftest)
        run: cargo test
      - name: Fixture corpus regenerates byte-identically (checked-in rasters, no poppler)
        run: |
          cargo run --example gen_fixtures -- --out "$RUNNER_TEMP/corpus"
          diff -r -x expected.toml tests/fixtures/corpus "$RUNNER_TEMP/corpus"
      - name: Upload BDD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-report
          path: embeddings-fundamentals/reports/bdd/
          if-no-files-found: warn

  integration-local:
    name: integration (poppler, tesseract, local engines)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler and tesseract
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-por
      - name: Install Rust 1.99.1 (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Verify toolchain
        run: rustc --version | grep -F "rustc 1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: embeddings-fundamentals
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('embeddings-fundamentals/config/experiments/**') }}
      - name: Integration tests
        env:
          RUN_INTEGRATION: "1"
        run: cargo test --features engine-embed-anything,engine-fastembed --test integration -- --include-ignored
