# Stage 2 engine comparison (PRD §10): the same multilingual MiniLM as the stage-1
# baseline, run through FastEmbed (ONNX Runtime) from the Xenova ONNX export. Only the
# engine and weight format change, so differences are an end-to-end configuration
# comparison, not an engine effect alone.

[engine]
engine = "fastembed"
model_id = "Xenova/paraphrase-multilingual-MiniLM-L12-v2"
model_revision = "2c4055b12046f11709e9df2c122e59ffbdc2f900"
weights = "onnx/model.onnx"
dimensions = 384
# sentence-transformers max_seq_length for this model (same as the baseline).
max_input_tokens = 128
prefix_policy = "none"

[ingest]
max_attempts = 3
backoff_ms = 200
batch_size = 32
language = "pt-BR"
