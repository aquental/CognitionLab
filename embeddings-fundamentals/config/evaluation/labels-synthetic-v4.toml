# Relevance labels for the SYNTHETIC fixture corpus (tests/fixtures/corpus), written by
# hand from the chunk texts: 0 = irrelevant, 1 = partially relevant, 2 = directly
# relevant (PRD §9.2). Items not listed are irrelevant (0). These labels measure the
# pipeline on synthetic documents only; labels for the owner's anonymized corpus are
# an outstanding owner input (PLAN §0.2).
#
# v2 (2026-10-28, review finding C2-1): every text label carries an `anchor`, a
# distinctive substring of the chunk text it was written for. A chunk id is unique only
# within one chunking revision, so the evaluator refuses to score a label whose chunk is
# missing from the evaluated index or no longer contains its anchor (NFC,
# case-insensitive, whitespace collapsed), instead of silently attaching the judgment to
# different text.
#
# v3 (2026-10-28, Milestone 3): the judgments of v2 unchanged; every image label now
# carries an `anchor` naming its original image: the file name of an image file, or
# `<file>#page=<page>&image=<pdfimages num>` for an image embedded in a PDF. An image
# chunk id numbers the images an image run keeps on a page, so a filter change could
# make it name another image; the evaluator refuses an image label whose chunk does not
# come from the anchored original. v2 stays checked in because the Phase 2 evidence
# (reports/phase-2) was produced with it.
#
# v4 (2026-10-28, review finding C3-5): the judgments of v3 unchanged; every image label
# also carries `asset_checksum`, the SHA-256 of the stored (metadata-free, upright,
# flattened) asset it was written for. A file name and a PDF image number do not
# identify pixels across source revisions, so the evaluator refuses an image label whose
# chunk's asset has other content. The stored asset depends on the scrubber
# (`assets::SCRUBBER_ID`); a scrubber change therefore also makes these labels refuse
# until they are re-checked.
version = "labels-synthetic-v4"
query_set = "queries-v1"
corpus = "synthetic"

