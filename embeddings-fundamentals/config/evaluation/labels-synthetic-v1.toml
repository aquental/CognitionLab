# Relevance labels for the SYNTHETIC fixture corpus (tests/fixtures/corpus), written by
# hand from the chunk texts: 0 = irrelevant, 1 = partially relevant, 2 = directly
# relevant (PRD §9.2). Items not listed are irrelevant (0). These labels measure the
# pipeline on synthetic documents only; labels for the owner's anonymized corpus are
# an outstanding owner input (PLAN §0.2). Image items are labeled now so the labels
# stay frozen when image retrieval is evaluated (Milestone 3).
