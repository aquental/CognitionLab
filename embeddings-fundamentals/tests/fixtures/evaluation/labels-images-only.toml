# Low-relevance fixture (US-03 "Report low relevance without hiding a completed
# experiment"): only image items are relevant, so a text-only index can retrieve
# nothing relevant. Every retrieved text chunk is unlabeled, which means label 0.
# v2: image labels carry the anchor of their original image (see labels-synthetic-v3).
version = "labels-images-only-v2"
query_set = "queries-v1"
corpus = "synthetic"

[[label]]
query = "q07"
item = "chest-001-p1-image-0"
anchor = "chest-001.png"
label = 2
note = "Synthetic chest radiograph"

[[label]]
query = "q08"
item = "abd-us-001-p1-image-0"
anchor = "abd-us-001.jpg"
label = 2
note = "Synthetic abdominal ultrasound image"

[[label]]
query = "q09"
item = "us-mixed-003-p1-image-0"
anchor = "us-mixed-003.pdf#page=1&image=0"
label = 2
note = "Image embedded in the ultrasound report"
