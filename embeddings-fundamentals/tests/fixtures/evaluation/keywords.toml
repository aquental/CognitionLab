components = [[4, 1.0]]

[[keywords]]
keyword = "conclusão"
components = [[5, 1.0]]

[[keywords]]
keyword = "laudo"
components = [[6, 0.5]]

[[keywords]]
keyword = "achados"
components = [[7, 1.0]]

[[keywords]]
