ingestion_model_load_ms = 100.0
ingestion_duration_ms = 43.0
pages = 6
chunks = 28
ms_per_page = 7.166666666666667
chunks_per_second = 651.1627906976745
embedding_calls = 3
embedding_total_ms = 43.0
