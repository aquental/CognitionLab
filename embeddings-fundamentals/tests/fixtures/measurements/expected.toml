items_per_second = 651.1627906976745
cold_model_load_ms = 100.0
cold_first_operation_ms = 15.0
# first adapter call = first manifest source, lab-searchable-001: 5 + 5 text chunks
cold_first_operation_items = 10
cold_total_ms = 115.0
query_side_model_load_ms = 100.0
query_side_first_query_ms = 6.0
query_side_total_ms = 106.0
warm_samples = 20
