# Controlled observations for US-05 "Save a reproducible comparison report".
#
# The clock is a ManualClock that moves only while controlled work runs: every model
# load (the experiment's `build`) advances it `model_load_ms`, and every adapter call
# advances it `call_ms + item_ms x items` while the call runs. Reading the clock never
# moves it, so a timer that starts after its operation, or stops before it, measures
# 0 ms and fails these checks (review finding C2-18). Extraction, chunking, and store
# work take no clock time. The memory probe returns `peak_rss_bytes`.
#
# Both configurations ingest the three synthetic PDFs (6 pages, 28 text chunks; batch
# size 32 gives one adapter call per source, 3 calls). By hand:
#   ingestion model load  = 100 ms
#   adapter calls         = (5 + 10) + (5 + 10) + (5 + 8) = 15 + 15 + 13 = 43 ms
#     (sum over calls: 3 x 5 ms + 28 items x 1 ms; the first call is lab-searchable-001,
#      5 + 5 text chunks = 10 items)
#   ingestion duration    = the three calls             = 43 ms
#   ms per page           = 43 / 6                      = 7.1666...
#   chunks per second     = 28 / 0.043 s                = 651.1627...
#   embedding total       = 43 ms; mean batch latency 43 / 3 = 14.333...
#   embedding throughput  = 28 / 0.043 s                = 651.1627...
#   cold start (PRD §9.4: first operation of the fresh process)
#                         = first model load 100 ms + first adapter call 15 ms = 115 ms
#   query-side start (second load in the same, warm process; not a cold start)
#     model load          = 100 ms
#     first query         = one query call, 5 + 1 x 1   = 6 ms; total 106 ms
#   warm query            = 6 ms per sample; median 6 ms, p95 6 ms
#   warm samples          = latency_repeats x 10 queries = 20
# Usage (whitespace tokens of all chunk texts) and index size (bytes of the active
# revision files) are recomputed independently by the step from the store.
model_load_ms = 100
call_ms = 5
item_ms = 1
peak_rss_bytes = 123456789
latency_repeats = 2

[hardware]
os = "fixture-os"
arch = "fixture-arch"
cpu = "Fixture CPU"
logical_cpus = 8
memory_bytes = 17179869184
accelerator = "cpu"

