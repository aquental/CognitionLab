# Hand-derived labels of the top three image-only results per frozen query, for the
# deterministic image index of tests/fixtures/evaluation/image-keywords.toml (the three
# synthetic images) and config/evaluation/labels-synthetic-v3.toml.
#
# Image vectors (normalized): chest = e0; abd-us = (e1+e2)/sqrt2; us-mixed = (e1+e3)/sqrt2.
# q07 "radiografia" -> e0: chest 1.0 (label 2); abd-us 0, us-mixed 0 (label 0, 0)
#     -> [2, 0, 0].
# q08 "ultrassonografia abdominal" -> (e1+e2)/sqrt2: abd-us 1.0 (label 2); us-mixed 0.5
#     (label 2); chest 0 (label 0) -> [2, 2, 0].
# q09 "laudo de ultrassonografia" -> (e1+e3)/sqrt2: us-mixed 1.0 (label 2); abd-us 0.5
#     (label 1); chest 0 (label 0) -> [2, 1, 0].
# q05 and q06 contain "laudo" -> e3: us-mixed 0.7071, the others 0; no image is labeled
#     for them -> [0, 0, 0].
# q01-q04 and q10 contain no keyword: their hash vectors are zero on axes 0..3, where
#     every image vector lies, so all three images score 0 -> [0, 0, 0].
# Ties only ever join items with the same label (q07: abd-us and us-mixed, both 0), so
# the label at each rank does not depend on the record-id tie-break.
#
# nDCG uses each query's frozen labels over every modality (PRD §5.3): q08's ideal
# ranking is [2, 2, 1] (two images and the report titles), so a perfect image ranking
# still scores below 1 there.

[[query]]
id = "q01"
ranks = [0, 0, 0]

[[query]]
id = "q02"
ranks = [0, 0, 0]

[[query]]
