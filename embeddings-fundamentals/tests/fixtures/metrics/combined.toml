# Hand-derived top three combined results per frozen query: RRF (k = 60, ranks from 1,
# fusion depth "all") over the text-only index of text-only.ranks.toml and the
# image-only index of image-only.ranks.toml, with config/evaluation/labels-synthetic-v4.toml.
#
# Text and image records are distinct items, so no item is in both lists: the fused
# score of a leg's rank r is 1/(60 + r). Ranks 1 and 2 of the fused list are the two
# leg winners (both 1/61), in ascending record-id order; rank 3 is the smaller record
# id of the two leg runners-up (both 1/62). Every fused tie therefore joins a text and
# an image result, and the record-id tie-break decides it.
#
# Re-derived 2026-10-29 after the chunking rules changed to structure-aware-v1/r2 (text
# revisions, and so text record ids, changed; no chunk text of this corpus changed).
#
# Record ids are hashes of (revision, chunk, space) and are inputs of the derivation,
# read from the fixture index; `records` pins them per rank, so a change of corpus,
# extraction, chunking, or either space fails with the changed record named instead of
# silently re-deriving these labels. Leg rankings (record id prefix, chunk, label)
# follow from the per-leg derivations in text-only.ranks.toml and image-only.ranks.toml
# (equal leg scores are ordered by record id inside each leg as well).
