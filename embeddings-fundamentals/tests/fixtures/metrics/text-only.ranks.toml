# Hand-derived labels of the top three text-only results per frozen query, for the
# deterministic fixture index of tests/fixtures/evaluation/keywords.toml over the
# synthetic corpus and config/evaluation/labels-synthetic-v2.toml.
#
# Scores are cosines of normalized keyword vectors (query keywords -> chunk keywords):
# q01 hemoglobina: both hemoglobin rows 1.0 (label 2, 2); every other chunk 0.0
#     (label 0) -> ranks [2, 2, 0].  q02 glicemia and q03 creatinina: same shape.
# q04 (e3+e4)/sqrt2: both cholesterol and both triglyceride rows 0.7071 (all label 2)
#     -> [2, 2, 2].
# q05 (e5 + 0.5 e6)/sqrt1.25: lab conclusion lines (e5) 0.8944 (label 1, 1); US
#     conclusions (e5+e8+e9)/sqrt3 0.5164 (label 2); lab titles (e6) 0.4472
#     -> [1, 1, 2].
# q06 (0.5 e6 + e7)/sqrt1.25: both findings sections 0.8944 (label 2, 2); lab titles
#     0.4472 (label 0) -> [2, 2, 0].
# q07 has no keyword: its hash vector is zero on axes 0..10, so keyword chunks score 0
#     and only unlabeled chunks can score above 0. No text chunk is relevant -> [0, 0, 0].
# q08 (e8+e9)/sqrt2: US titles (0.5 e6+e8+e9)/1.5 score 0.9428 (label 1, 1); US
#     conclusions 0.8165 (label 0) -> [1, 1, 0].
# q09 (0.5 e6 + e8)/sqrt1.25: no text chunk is labeled for q09 -> [0, 0, 0].
# q10 técnica: both technique sections 1.0 (label 2, 2); every other chunk 0.0
#     -> [2, 2, 0].
# Ties only ever join items with the same label, so the label at each rank does not
# depend on the record-id tie-break.

[[query]]
id = "q01"
ranks = [2, 2, 0]

