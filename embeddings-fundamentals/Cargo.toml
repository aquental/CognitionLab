[package]
name = "embeddings-fundamentals"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Medical Document Embedding Lab: reproducible extraction, embedding and retrieval experiments"

[lib]
name = "embeddings_fundamentals"
path = "src/lib.rs"

[features]
default = []
# Engine adapters are strictly additive: each feature only adds an adapter and its dependencies.
engine-embed-anything = ["dep:embed_anything", "dep:tokenizers"]
engine-fastembed = ["dep:fastembed", "dep:hf-hub", "dep:tokenizers"]
engine-openai = ["dep:reqwest", "dep:tiktoken-rs"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
embed_anything = { version = "0.7.1", optional = true }
fastembed = { version = "7.5.0", optional = true, default-features = false, features = ["onnx", "ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
hex = "0.4.3"
hf-hub = { version = "0.5.0", optional = true, default-features = false, features = ["ureq", "rustls-tls"] }
kamadak-exif = "0.6.1"
lopdf = "0.46.0"
nix = { version = "0.31.3", default-features = false, features = ["resource"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tiktoken-rs = { version = "0.12.1", optional = true }
tokenizers = { version = "0.22.1", optional = true, default-features = false, features = ["onig"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"

[dev-dependencies]
approx = "0.5.1"
cucumber = { version = "0.23", features = ["output-json"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
proptest = "1.12.0"
# Tests run with insertion-ordered JSON maps so the canonical encoder's explicit key sort is exercised.
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false

[[test]]
name = "bdd_selftest"
path = "tests/bdd_selftest.rs"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
float_cmp = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
